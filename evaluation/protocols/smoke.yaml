# Short check of the whole chain: not a policy test, it only verifies that start-up, transitions,
# band release, commands and logging work end to end.
name: smoke
nominal_height: 0.98
deepest_height: 0.60
# ramps of the CONTROLLER's height target (observations.h): the scripted joystick uses them to know
# how long to hold RT/B. If the controller changes, change them here too.
descend_rate: 0.05
rise_rate: 0.05
band_release_at: 12.0
stop_at: 40.0
timeline:
  - {t:  2.0, do: fixstand}
  - {t:  8.0, do: rl}
  - {t: 14.0, vx: 0.0, vy: 0.0, wz: 0.0}
  - {t: 20.0, vx: 1.0}
  - {t: 28.0, vx: 0.0}
  - {t: 32.0, height: 0.74}
