# ============================================================================================
# STANDARD TEST PROTOCOL v3 — H1_2 squat (the protocol used for the thesis results)
#
# Sections: A) standing with zero command; B) standing, the six velocity axes; C) height ladder from
# standing, back to 0.98 every time; D) the six axes at the lowest walking height 0.71 m;
# E) back up and final standing.
#
# `stop_height: 0.71` declares the controller STOP: R2 alone stops at cutoff_height + 1 cm, going
# further requires A + R2. The scripted joystick acts like a hand: RT down to the stop, then A + RT;
# arriving on the stop from above it holds RT for `overhold`, as at the other ends of travel, so the
# height of section D is exactly 0.71. The descents of section C to 0.66 and 0.60 pass through the
# stop, so the A + R2 path is exercised at every run. `stop_height` MUST equal cutoff_height + 0.01
# of the policy's deploy.yaml: run_protocol.py checks it before starting.
#
# Semantics: every entry has a time `t` (SIMULATION time, s) and a STICKY state — vx/vy/wz/height hold
# until a later entry changes them. `do` is a pulse instead. vx, vy in m/s; wz in rad/s; height in m.
# Amplitudes at the ends of the training ranges (vx in [-0.3, 1.0], vy in [-0.3, 0.3], wz in [-0.5, 0.5]).
# compare_runs.py refuses to compare runs of different protocols.
# ============================================================================================
name: standard_v3
nominal_height: 0.98
deepest_height: 0.60
stop_height: 0.71
# ramps of the CONTROLLER's height target (observations.h): the scripted joystick uses them to know
# how long to hold RT/B. If the controller changes, change them here too.
descend_rate: 0.05
rise_rate: 0.05
band_release_at: 12.0
overhold: 1.5
stop_at: 306.0

timeline:
  # ---- start-up ------------------------------------------------------------------------
  - {t:   2.0, do: fixstand}
  - {t:   8.0, do: rl}
  - {t:  14.0, vx: 0.0, vy: 0.0, wz: 0.0}

  # ---- A) standing, zero command: reference for sway and lean ---------------------------
  - {t:  14.0}

  # ---- B) standing, the six axes ----------------------------------------------------------
  - {t:  24.0, vx:  1.0}
  - {t:  33.0, vx:  0.0}
  - {t:  37.0, vx: -0.3}
  - {t:  46.0, vx:  0.0}
  - {t:  50.0, vy:  0.3}
  - {t:  59.0, vy:  0.0}
  - {t:  63.0, vy: -0.3}
  - {t:  72.0, vy:  0.0}
  - {t:  76.0, wz:  0.5}
  - {t:  85.0, wz:  0.0}
  - {t:  89.0, wz: -0.5}
  - {t:  98.0, wz:  0.0}

  # ---- C) height ladder from standing, RESTARTING from 0.98 every time --------------------
  # With 0.05 m/s ramps: 0.98->0.85 2.6 s, ->0.74 4.8 s, ->0.66 6.4 s, ->0.60 7.6 s, same returns
  # + 1.5 s overhold. The intervals leave >= 3 s at the settled height.
  - {t: 102.0, height: 0.85}
  - {t: 110.0, height: 0.98}
  - {t: 116.0, height: 0.74}
  - {t: 126.0, height: 0.98}
  - {t: 134.0, height: 0.66}
  - {t: 144.0, height: 0.98}
  - {t: 154.0, height: 0.60}    # 7.6 s descent + 24 s at the bottom: the long hold
  - {t: 186.0, height: 0.98}

  # ---- D) lowest walking height 0.71 m (controller stop), the same six axes ---------------
  # 0.98->0.71 with RT alone: 5.4 s, then 1.5 s overhold on the stop; 2.6 s at the settled height
  # before the first command at 206.
  - {t: 198.0, height: 0.71}
  - {t: 206.0, vx:  1.0}
  - {t: 215.0, vx:  0.0}
  - {t: 219.0, vx: -0.3}
  - {t: 228.0, vx:  0.0}
  - {t: 232.0, vy:  0.3}
  - {t: 241.0, vy:  0.0}
  - {t: 245.0, vy: -0.3}
  - {t: 254.0, vy:  0.0}
  - {t: 258.0, wz:  0.5}
  - {t: 267.0, wz:  0.0}
  - {t: 271.0, wz: -0.5}
  - {t: 280.0, wz:  0.0}

  # ---- E) back up and final standing --------------------------------------------------------
  - {t: 284.0, height: 0.98}
  - {t: 294.0}
