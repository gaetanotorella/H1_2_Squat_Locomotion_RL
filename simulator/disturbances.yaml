# MANUAL pushes for robustness tests of the policy (see src/push_disturbance.h).
# Enabled with `disturbance_script: "disturbances.yaml"` in config.yaml. With the MuJoCo window in
# focus, press the key: the push starts immediately. With the ground-truth log active it is logged to
# sim_logs/sim_<ts>/disturbance_events.csv (analysis: evaluation/report_pushes.py).
#
# force in N, torque in N.m, dur in s (0 = a single physics step). frame: body (default), "forward"
# is the robot's forward; world = world axes. point: metres in the body frame, default the CoM.
# 20 N.s on 79.5 kg = 0.25 m/s change of the CoM velocity.
# Keys 7, 8, 9 belong to the elastic band: do not use them.
presets:
  - {key: "1", body: torso_link, force: [ 100,    0, 0], dur: 0.2}   # 20 N.s forward
  - {key: "2", body: torso_link, force: [-100,    0, 0], dur: 0.2}   # 20 N.s backward
  - {key: "3", body: torso_link, force: [   0,  100, 0], dur: 0.2}   # 20 N.s to the left
  - {key: "4", body: torso_link, force: [   0, -100, 0], dur: 0.2}   # 20 N.s to the right
  - {key: "5", body: torso_link, force: [ 150,    0, 0], dur: 0.2}   # 30 N.s forward
  - {key: "6", body: torso_link, force: [-150,    0, 0], dur: 0.2}   # 30 N.s backward
  - {key: "Q", body: pelvis,     torque: [0, 0,  30],    dur: 0.2}   # yaw torque +
  - {key: "W", body: pelvis,     torque: [0, 0, -30],    dur: 0.2}   # yaw torque -
  - {key: "E", body: torso_link, force: [  60,    0, 0], dur: 2.0}   # continuous push forward for 2 s (60 N)
