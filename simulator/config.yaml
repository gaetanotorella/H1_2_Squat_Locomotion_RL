robot: "h1_2"             # robot folder in assets/
robot_scene: "scene.xml"  # scene file in assets/<robot>/

domain_id: 0              # DDS domain id
interface: "lo"           # DDS network interface: lo for sim2sim on this PC

use_joystick: 1           # a gamepad acts as the Unitree wireless remote
joystick_type: "xbox"     # "xbox" or "switch" layout ("script" is set by evaluation/run_protocol.py)
joystick_device: "/dev/input/js0"
joystick_bits: 16         # some gamepads only have 8-bit accuracy

print_scene_information: 1  # print links, joints and sensors of the robot

enable_elastic_band: 1    # virtual spring holding the robot at start-up: key 9 toggles it, 7/8 shorten/lengthen it

disturbance_script: ""    # manual pushes bound to keys: "disturbances.yaml" to enable them (src/push_disturbance.h)

log_ground_truth: 0       # 1 (or --log) writes the true base state to <log_dir>/sim_<timestamp>/ground_truth.csv
log_dir: ""               # empty = <repo>/sim_logs
